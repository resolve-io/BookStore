name: Deploy Bookstore to AWS

on:
  workflow_dispatch:


concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true
  
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
  pull-requests: write

jobs:

  deploy-ecs:
    name: Deploy Bookstore to EKS
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DEVOPS_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.DEVOPS_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.DEVOPS_AWS_REGION }}
      
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: "true"

    - name: Render ECS task definition
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      id: render-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ github.workspace }}/deploy/task-definition.json
        container-name: bookstore-container
        image: 432993365903.dkr.ecr.us-east-1.amazonaws.com/bookstore:latest
    - name: Create Target Group, load balancer and listener
      run: |
        aws elbv2 create-target-group --name bookstore-${{ github.run_id }} --protocol HTTP --port 80 --vpc-id vpc-0490a931bc8e39bae --target-type ip
        target_group_arn=$(aws elbv2 describe-target-groups --names bookstore-${{ github.run_id }} --output text --query "TargetGroups[*].[TargetGroupArn]")
        aws elbv2 create-load-balancer --name bookstore-alb-${{ github.run_id }} --subnets subnet-09cbd51d21ac71fbb subnet-0e735835d90756222 subnet-06d19d11cf3d5a054 subnet-0f4acdeded5531668 subnet-04e42729a34259baa subnet-0c86c07f9382be5fc --security-groups sg-03e1bcaae7893d3ee --scheme internet-facing --type application
        loadbalancer_arn=$(aws elbv2 describe-load-balancers --name bookstore-alb-${{ github.run_id }} --output text --query "LoadBalancers[*].LoadBalancerArn)
        aws elbv2 create-listener --load-balancer-arn $loadbalancer_arn --protocol HTTP --port 80 --default-actions Type=forward,TargetGroupArn=$target_group_arn

    - name: Deploy ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.render-task-def.outputs.task-definition }}
        service: bookstore-${{ github.run_id }}
        cluster: bookstore
        wait-for-service-stability: true
    - name: Get Loadbalancer address
      run: |
         aws elbv2 describe-load-balancers --name bookstore-alb-${{ github.run_id }} --output text --query "LoadBalancers[*].DNSName"